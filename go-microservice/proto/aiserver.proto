// aiserver.proto - Enterprise-grade Vector Processing Service
// Version 2.0 - High-Performance gRPC/Protobuf Communication
syntax = "proto3";

package aiserver;

// canonical go_package for module-based imports
option go_package = "legal-ai-production/go-microservice/proto/aiserver;aiserver";

// The core vector processing service definition
service VectorService {
  // Basic vector operations
  rpc ProcessRotation(VectorRequest) returns (VectorResponse) {}
  rpc ProcessSimilarity(SimilarityRequest) returns (SimilarityResponse) {}

  // Advanced legal document processing
  rpc ProcessLegalDocument(LegalDocumentRequest) returns (LegalDocumentResponse) {}
  rpc FindSimilarDocuments(DocumentSimilarityRequest) returns (DocumentSimilarityResponse) {}

  // Batch operations for high throughput
  rpc BatchProcessVectors(BatchVectorRequest) returns (BatchVectorResponse) {}
  rpc BatchComputeSimilarity(BatchSimilarityRequest) returns (BatchSimilarityResponse) {}

  // Real-time streaming operations
  rpc StreamVectorProcessing(stream StreamVectorRequest) returns (stream StreamVectorResponse) {}

  // Health and monitoring
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse) {}
}

// Enhanced service for RabbitMQ integration
service AsyncJobService {
  rpc SubmitAsyncJob(AsyncJobRequest) returns (AsyncJobResponse) {}
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse) {}
  rpc GetJobResult(JobResultRequest) returns (JobResultResponse) {}
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {}
}

// Core data structures
message Quaternion {
  float w = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message Vector3D {
  float x = 1;
  float y = 2;
  float z = 3;
}

message EmbeddingVector {
  repeated float values = 1;
  int32 dimensions = 2;
  string model_type = 3; // "nomic-embed", "legal-bert", etc.
}

message DocumentMetadata {
  string document_id = 1;
  string title = 2;
  string content_type = 3;
  string jurisdiction = 4;
  repeated string legal_entities = 5;
  map<string, string> custom_fields = 6;
  int64 timestamp = 7;
}

// Request/Response messages for basic operations
message VectorRequest {
  string job_id = 1;
  Quaternion quaternion = 2;
  repeated float points = 3;
  RequestMetadata metadata = 4;
}

message VectorResponse {
  string job_id = 1;
  repeated float rotated_points = 2;
  string status = 3;
  float processing_time_ms = 4;
  string gpu_info = 5;
  ResponseMetadata metadata = 6;
}

message SimilarityRequest {
  string job_id = 1;
  EmbeddingVector vector_a = 2;
  EmbeddingVector vector_b = 3;
  SimilarityType similarity_type = 4;
  RequestMetadata metadata = 5;
}

message SimilarityResponse {
  string job_id = 1;
  float cosine_similarity = 2;
  float euclidean_distance = 3;
  float manhattan_distance = 4;
  string status = 5;
  float processing_time_ms = 6;
  float confidence_score = 7;
  ResponseMetadata metadata = 8;
}

// Legal document processing messages
message LegalDocumentRequest {
  string job_id = 1;
  string content = 2;
  DocumentMetadata metadata = 3;
  ProcessingOptions options = 4;
  RequestMetadata request_metadata = 5;
}

message LegalDocumentResponse {
  string job_id = 1;
  EmbeddingVector embedding = 2;
  repeated LegalEntity extracted_entities = 3;
  LegalAnalysis analysis = 4;
  string status = 5;
  float processing_time_ms = 6;
  ResponseMetadata metadata = 7;
}

message DocumentSimilarityRequest {
  string job_id = 1;
  EmbeddingVector query_embedding = 2;
  int32 limit = 3;
  float similarity_threshold = 4;
  repeated string filter_jurisdictions = 5;
  RequestMetadata metadata = 6;
}

message DocumentSimilarityResponse {
  string job_id = 1;
  repeated SimilarDocument similar_documents = 2;
  string status = 3;
  float processing_time_ms = 4;
  int32 total_candidates = 5;
  ResponseMetadata metadata = 6;
}

// Batch processing messages
message BatchVectorRequest {
  string batch_id = 1;
  repeated VectorRequest requests = 2;
  BatchProcessingOptions options = 3;
  RequestMetadata metadata = 4;
}

message BatchVectorResponse {
  string batch_id = 1;
  repeated VectorResponse responses = 2;
  string status = 3;
  float total_processing_time_ms = 4;
  int32 successful_operations = 5;
  int32 failed_operations = 6;
  ResponseMetadata metadata = 7;
}

message BatchSimilarityRequest {
  string batch_id = 1;
  repeated SimilarityRequest requests = 2;
  BatchProcessingOptions options = 3;
  RequestMetadata metadata = 4;
}

message BatchSimilarityResponse {
  string batch_id = 1;
  repeated SimilarityResponse responses = 2;
  string status = 3;
  float total_processing_time_ms = 4;
  int32 successful_operations = 5;
  int32 failed_operations = 6;
  ResponseMetadata metadata = 7;
}

// Streaming messages
message StreamVectorRequest {
  string session_id = 1;
  oneof request_type {
    VectorRequest vector_request = 2;
    SimilarityRequest similarity_request = 3;
    LegalDocumentRequest document_request = 4;
  }
  RequestMetadata metadata = 5;
}

message StreamVectorResponse {
  string session_id = 1;
  oneof response_type {
    VectorResponse vector_response = 2;
    SimilarityResponse similarity_response = 3;
    LegalDocumentResponse document_response = 4;
  }
  ResponseMetadata metadata = 5;
}

// Async job processing messages
message AsyncJobRequest {
  string job_id = 1;
  JobType job_type = 2;
  JobPriority priority = 3;
  oneof payload {
    VectorRequest vector_request = 4;
    LegalDocumentRequest document_request = 5;
    BatchVectorRequest batch_request = 6;
  }
  RequestMetadata metadata = 7;
}

message AsyncJobResponse {
  string job_id = 1;
  JobStatus status = 2;
  string message = 3;
  int64 estimated_completion_time = 4;
  ResponseMetadata metadata = 5;
}

message JobStatusRequest {
  string job_id = 1;
  RequestMetadata metadata = 2;
}

message JobStatusResponse {
  string job_id = 1;
  JobStatus status = 2;
  float progress_percentage = 3;
  string current_stage = 4;
  int64 started_at = 5;
  int64 estimated_completion_time = 6;
  ResponseMetadata metadata = 7;
}

message JobResultRequest {
  string job_id = 1;
  RequestMetadata metadata = 2;
}

message JobResultResponse {
  string job_id = 1;
  JobStatus status = 2;
  oneof result {
    VectorResponse vector_result = 3;
    LegalDocumentResponse document_result = 4;
    BatchVectorResponse batch_result = 5;
  }
  float total_processing_time_ms = 6;
  ResponseMetadata metadata = 7;
}

message CancelJobRequest {
  string job_id = 1;
  string reason = 2;
  RequestMetadata metadata = 3;
}

message CancelJobResponse {
  string job_id = 1;
  bool cancelled = 2;
  string message = 3;
  ResponseMetadata metadata = 4;
}

// Health check and monitoring
message HealthCheckRequest {
  string service_name = 1;
}

message HealthCheckResponse {
  HealthStatus status = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  SystemMetrics system_metrics = 4;
  string gpu_status = 5;
  string database_status = 6;
  string cache_status = 7;
  string message_queue_status = 8;
}

message MetricsRequest {
  string metric_type = 1;
  int64 start_time = 2;
  int64 end_time = 3;
}

message MetricsResponse {
  repeated Metric metrics = 1;
  SystemMetrics system_metrics = 2;
  PerformanceMetrics performance_metrics = 3;
}

// Supporting data structures
message LegalEntity {
  string entity_type = 1; // "person", "organization", "court", etc.
  string name = 2;
  string role = 3; // "plaintiff", "defendant", "judge", etc.
  float confidence = 4;
  repeated string aliases = 5;
}

message LegalAnalysis {
  string document_type = 1; // "contract", "case", "statute", etc.
  repeated string legal_topics = 2;
  float complexity_score = 3;
  float risk_assessment = 4;
  repeated Citation citations = 5;
  map<string, float> confidence_scores = 6;
}

message Citation {
  string citation_text = 1;
  string case_name = 2;
  string jurisdiction = 3;
  int32 year = 4;
  float relevance_score = 5;
}

message SimilarDocument {
  string document_id = 1;
  string title = 2;
  float similarity_score = 3;
  DocumentMetadata metadata = 4;
  string excerpt = 5;
}

message ProcessingOptions {
  bool extract_entities = 1;
  bool perform_analysis = 2;
  bool generate_summary = 3;
  bool extract_citations = 4;
  string analysis_model = 5;
  repeated string custom_fields = 6;
}

message BatchProcessingOptions {
  int32 batch_size = 1;
  bool fail_fast = 2;
  int32 max_parallel = 3;
  int32 timeout_seconds = 4;
}

message RequestMetadata {
  string user_id = 1;
  string session_id = 2;
  string client_version = 3;
  int64 timestamp = 4;
  string trace_id = 5;
  map<string, string> headers = 6;
}

message ResponseMetadata {
  string server_version = 1;
  int64 timestamp = 2;
  string trace_id = 3;
  string gpu_device = 4;
  float gpu_memory_used_mb = 5;
  int32 cache_hits = 6;
  int32 cache_misses = 7;
}

message SystemMetrics {
  float cpu_usage_percent = 1;
  float memory_usage_mb = 2;
  float gpu_usage_percent = 3;
  float gpu_memory_usage_mb = 4;
  int32 active_connections = 5;
  int64 total_requests = 6;
}

message PerformanceMetrics {
  float avg_response_time_ms = 1;
  float p95_response_time_ms = 2;
  float p99_response_time_ms = 3;
  int64 requests_per_second = 4;
  int64 errors_per_second = 5;
  float cache_hit_ratio = 6;
}

message Metric {
  string name = 1;
  string type = 2; // "counter", "gauge", "histogram"
  repeated MetricValue values = 3;
}

message MetricValue {
  int64 timestamp = 1;
  float value = 2;
  map<string, string> labels = 3;
}

// Enums
enum SimilarityType {
  SIMILARITY_TYPE_UNSPECIFIED = 0;
  COSINE = 1;
  EUCLIDEAN = 2;
  MANHATTAN = 3;
  DOT_PRODUCT = 4;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  VECTOR_PROCESSING = 1;
  DOCUMENT_ANALYSIS = 2;
  SIMILARITY_COMPUTATION = 3;
  BATCH_PROCESSING = 4;
  LEGAL_EXTRACTION = 5;
}

enum JobPriority {
  JOB_PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  NORMAL = 2;
  HIGH = 3;
  URGENT = 4;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  QUEUED = 1;
  PROCESSING = 2;
  COMPLETED = 3;
  FAILED = 4;
  CANCELLED = 5;
  TIMEOUT = 6;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTHY = 1;
  DEGRADED = 2;
  UNHEALTHY = 3;
  UNKNOWN = 4;
}