syntax = "proto3";

package legal_cuda_streaming;

option go_package = "legal-ai-production/proto/legal_cuda_streaming;legal_cuda_streaming";

// CUDA-accelerated legal processing service
service LegalCudaService {
  // Bidirectional streaming for real-time CUDA processing
  rpc BidirectionalLegalStream(stream CudaRequest) returns (stream CudaResponse);
  
  // Document analysis with GPU acceleration
  rpc ProcessLegalDocument(DocumentRequest) returns (stream DocumentResponse);
  
  // Semantic search with CUDA-accelerated embeddings
  rpc StreamSemanticSearch(SearchRequest) returns (stream SearchResponse);
  
  // Case similarity analysis
  rpc AnalyzeCaseSimilarity(SimilarityRequest) returns (stream SimilarityResponse);
}

// Core CUDA computation request
message CudaRequest {
  string session_id = 1;
  string operation_type = 2;  // "embed", "search", "analyze", "cluster"
  
  oneof data {
    bytes raw_text = 3;               // Legal document text
    repeated float embedding_vector = 4;  // Pre-computed embeddings
    string legal_query = 5;           // Search query
  }
  
  CudaOptions cuda_options = 6;
  bool is_final_chunk = 7;
}

message CudaOptions {
  bool use_tensor_cores = 1;    // Enable Tensor Core acceleration
  int32 batch_size = 2;         // CUDA batch processing size
  float precision_mode = 3;     // FP16/FP32/INT8 precision
  bool enable_memory_pool = 4;  // CUDA memory pooling
  int32 stream_count = 5;       // CUDA stream parallelism
}

// CUDA computation response
message CudaResponse {
  string session_id = 1;
  string operation_type = 2;
  ProcessingStatus status = 3;
  
  oneof result {
    repeated float computed_embedding = 4;      // CUDA-computed embeddings
    repeated SearchMatch search_matches = 5;    // Similarity search results
    AnalysisResult analysis = 6;                // Document analysis
    ClusterResult clusters = 7;                 // Clustering results
  }
  
  CudaPerformanceMetrics cuda_metrics = 8;
  string error_message = 9;
}

// Legal document processing
message DocumentRequest {
  string document_id = 1;
  bytes document_content = 2;
  string document_type = 3;     // "contract", "brief", "statute", etc.
  string jurisdiction = 4;
  ProcessingFlags flags = 5;
}

message ProcessingFlags {
  bool extract_entities = 1;    // Legal entity extraction
  bool generate_summary = 2;    // Document summarization
  bool compute_embeddings = 3;  // Vector embeddings
  bool analyze_sentiment = 4;   // Legal sentiment analysis
  bool detect_clauses = 5;      // Contract clause detection
}

message DocumentResponse {
  string document_id = 1;
  ProcessingStage current_stage = 2;
  
  oneof stage_result {
    ExtractedEntities entities = 3;
    string summary = 4;
    repeated float embeddings = 5;
    SentimentAnalysis sentiment = 6;
    DetectedClauses clauses = 7;
  }
  
  float progress_percentage = 8;
  CudaPerformanceMetrics performance = 9;
}

// Semantic search
message SearchRequest {
  string query = 1;
  string collection_name = 2;   // "contracts", "cases", "statutes"
  int32 top_k = 3;
  SearchFilters filters = 4;
  bool enable_reranking = 5;
}

message SearchFilters {
  repeated string jurisdictions = 1;
  repeated string document_types = 2;
  string date_range_start = 3;
  string date_range_end = 4;
  map<string, string> metadata_filters = 5;
}

message SearchResponse {
  string query_id = 1;
  repeated SearchMatch matches = 2;
  int32 total_matches = 3;
  bool is_complete = 4;
  CudaPerformanceMetrics performance = 5;
}

message SearchMatch {
  string document_id = 1;
  float similarity_score = 2;
  string document_title = 3;
  string snippet = 4;
  map<string, string> metadata = 5;
  repeated float embedding = 6;  // Optional: return embeddings
}

// Case similarity analysis
message SimilarityRequest {
  string base_case_id = 1;
  repeated string compare_case_ids = 2;
  SimilarityMetrics requested_metrics = 3;
}

message SimilarityMetrics {
  bool factual_similarity = 1;
  bool legal_precedent_similarity = 2;
  bool outcome_similarity = 3;
  bool procedural_similarity = 4;
}

message SimilarityResponse {
  string base_case_id = 1;
  repeated CaseSimilarity similarities = 2;
  bool is_complete = 3;
}

message CaseSimilarity {
  string case_id = 1;
  float overall_similarity = 2;
  map<string, float> metric_scores = 3;  // Detailed similarity metrics
  string explanation = 4;
}

// Supporting data structures
message ExtractedEntities {
  repeated LegalEntity entities = 1;
}

message LegalEntity {
  string text = 1;
  string entity_type = 2;       // "person", "organization", "statute", etc.
  float confidence = 3;
  int32 start_pos = 4;
  int32 end_pos = 5;
}

message SentimentAnalysis {
  float sentiment_score = 1;    // -1.0 to 1.0
  string sentiment_label = 2;   // "positive", "negative", "neutral"
  float confidence = 3;
  repeated SentimentSegment segments = 4;
}

message SentimentSegment {
  string text = 1;
  float segment_sentiment = 2;
  int32 start_pos = 3;
  int32 end_pos = 4;
}

message DetectedClauses {
  repeated ContractClause clauses = 1;
}

message ContractClause {
  string clause_type = 1;       // "termination", "payment", "liability", etc.
  string clause_text = 2;
  float confidence = 3;
  int32 start_pos = 4;
  int32 end_pos = 5;
  map<string, string> parameters = 6;  // Extracted clause parameters
}

message AnalysisResult {
  string analysis_type = 1;
  map<string, string> results = 2;
  float confidence = 3;
}

message ClusterResult {
  repeated DocumentCluster clusters = 1;
  string clustering_method = 2;
}

message DocumentCluster {
  int32 cluster_id = 1;
  repeated string document_ids = 2;
  repeated float centroid = 3;
  float intra_cluster_distance = 4;
}

// Performance tracking
message CudaPerformanceMetrics {
  int64 cuda_compute_time_us = 1;       // Microseconds
  int64 memory_transfer_time_us = 2;    // Host-device transfer time
  int64 total_processing_time_us = 3;   // End-to-end time
  float gpu_utilization = 4;            // 0.0 to 1.0
  int64 gpu_memory_used_bytes = 5;
  int32 cuda_streams_used = 6;
  bool tensor_cores_utilized = 7;
  string gpu_model = 8;                 // e.g., "RTX 3060 Ti"
}

// Enums
enum ProcessingStatus {
  QUEUED = 0;
  PROCESSING = 1;
  COMPLETED = 2;
  FAILED = 3;
  CANCELLED = 4;
}

enum ProcessingStage {
  STAGE_INITIALIZATION = 0;
  STAGE_TEXT_EXTRACTION = 1;
  STAGE_ENTITY_EXTRACTION = 2;
  STAGE_EMBEDDING_GENERATION = 3;
  STAGE_ANALYSIS = 4;
  STAGE_FINALIZATION = 5;
}