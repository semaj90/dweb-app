# Redis Configuration for Legal AI Platform
# Optimized for high-performance caching, real-time messaging, and GPU cache orchestration
# Based on analysis of redis-helper.ts, redis-service.ts, loki-redis-integration.ts

################################## NETWORK #####################################

# Accept connections on any interface
bind 0.0.0.0

# Default port
port 6379

# TCP listen() backlog
tcp-backlog 511

# Close connection after client idle for N seconds (0 to disable)
timeout 300

# TCP keepalive
tcp-keepalive 300

################################# TLS/SSL ######################################

# TLS/SSL configuration (disabled for development)
# tls-port 6380
# tls-cert-file redis.crt
# tls-key-file redis.key

################################# GENERAL #####################################

# Run as daemon
daemonize yes

# Process ID file
pidfile ./redis.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file
logfile "./redis.log"

# Number of databases (legal AI uses multiple DBs)
databases 16

################################ SNAPSHOTTING  ################################

# Save the DB on disk periodically
# Legal AI platform persistence strategy
save 900 1      # At least 1 key changed in 900 seconds
save 300 10     # At least 10 keys changed in 300 seconds  
save 60 10000   # At least 10000 keys changed in 60 seconds

# Compress string objects using LZF when dump .rdb databases
rdbcompression yes

# Checksum the RDB file
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory
dir ./

################################# REPLICATION #################################

# Replication settings for production scaling
# replica-serve-stale-data yes
# replica-read-only yes

################################## SECURITY ###################################

# Authentication for production
# requirepass legal_ai_redis_2025

# Command renaming for security
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""

################################### CLIENTS ####################################

# Maximum number of connected clients
maxclients 10000

################################# MEMORY MANAGEMENT #########################

# Memory limit for Legal AI platform (2GB for development, scale for production)
maxmemory 2gb

# Memory eviction policy for cache optimization
# - allkeys-lru: Remove any key using LRU (good for cache)
# - volatile-lru: Remove expired keys using LRU
# - allkeys-lfu: Remove any key using LFU (Redis 4.0+)
maxmemory-policy allkeys-lru

# Memory sampling for LRU/LFU algorithms
maxmemory-samples 5

############################# LAZY FREEING ####################################

# Lazy freeing for better performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

############################ KERNEL OOM CONTROL ##############################

# OOM killer configuration
oom-score-adj no

#################### KERNEL TRANSPARENT HUGEPAGE CONTROL ######################

# Disable THP to reduce latency
disable-thp yes

############################## APPEND ONLY FILE ###############################

# AOF persistence for legal document safety
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF sync frequency
# - always: sync every write (safest, slowest)
# - everysec: sync every second (good compromise)
# - no: let OS decide when to sync (fastest, least safe)
appendfsync everysec

# Don't fsync during rewrites
no-appendfsync-on-rewrite no

# Auto-rewrite AOF when size increases
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

################################ LUA SCRIPTING  ###############################

# Lua script timeout (for rate limiting scripts)
lua-time-limit 5000

################################## SLOW LOG ###################################

# Slow log for performance monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

################################ LATENCY MONITOR ##############################

# Latency monitoring
latency-monitor-threshold 100

############################# EVENT NOTIFICATION ##############################

# Keyspace notifications for real-time features
notify-keyspace-events "Ex"

############################### ADVANCED CONFIG ###############################

# Hash table settings for memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization  
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog optimization
hll-sparse-max-bytes 3000

# Streams optimization for NATS-like messaging
stream-node-max-bytes 4096
stream-node-max-entries 100

################################## INCLUDES ###################################

# Include other config files
# include /path/to/local.conf

################################## MODULES #####################################

# Load modules (for Redis extensions if needed)
# loadmodule /path/to/module.so

################################## CLUSTERING ###################################

# Redis Cluster configuration (for production scaling)
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000

################################## CUSTOM LEGAL AI SETTINGS ##################

# Custom configurations for Legal AI platform performance

# Connection pooling optimization
tcp-keepalive 60

# Client output buffer limits for streaming
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Memory optimization for legal document caching
maxmemory-samples 10

# Persistence tuning for legal data safety
save 300 1      # Save more frequently for legal documents
stop-writes-on-bgsave-error yes

# Performance tuning for GPU cache orchestration
hz 10

# Enable keyspace notifications for real-time updates
notify-keyspace-events "KEA"

################################## PRODUCTION OVERRIDES ####################

# Production-specific settings (uncomment for production)
# maxmemory 16gb
# maxclients 50000
# requirepass your_secure_password_here
# bind 127.0.0.1
# protected-mode yes

################################## MONITORING ###############################

# Enable info persistence
info-replication-enable yes

# Latency tracking
latency-tracking yes
latency-tracking-info-percentiles 50 95 99