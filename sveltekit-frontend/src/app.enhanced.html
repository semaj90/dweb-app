<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0a0a0a" />
		
		<!-- Enhanced Meta Tags for YoRHa Legal AI -->
		<meta name="description" content="Advanced Legal AI Platform with GPU Acceleration, Vector Search, and Real-time Analysis" />
		<meta name="keywords" content="legal ai, gpu acceleration, vector search, evidence analysis, case management" />
		<meta name="author" content="YoRHa Legal AI Platform" />
		
		<!-- Open Graph / Social Media -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="YoRHa Legal AI Platform" />
		<meta property="og:description" content="Advanced Legal Intelligence Platform with GPU Acceleration" />
		<meta property="og:url" content="https://yorha-legal.ai" />
		<meta property="og:site_name" content="YoRHa Legal AI" />
		
		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="YoRHa Legal AI Platform" />
		<meta name="twitter:description" content="Advanced Legal Intelligence Platform with GPU Acceleration" />
		
		<!-- PWA / Mobile App -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="YoRHa Legal AI" />
		
		<!-- Preload Critical Resources -->
		<link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/Oswald-Regular.woff2" as="font" type="font/woff2" crossorigin />
		
		<!-- Critical CSS for YoRHa Theme -->
		<style>
			/* Critical YoRHa CSS - Inline for Performance */
			:root {
				--color-nier-bg-primary: #0a0a0a;
				--color-nier-bg-secondary: #1a1a1a;
				--color-nier-bg-tertiary: #2a2a2a;
				--color-nier-text-primary: #e0e0e0;
				--color-nier-text-secondary: #b0b0b0;
				--color-nier-text-muted: #808080;
				--color-nier-border-primary: #e0e0e0;
				--color-nier-border-secondary: #b0b0b0;
				--color-nier-border-muted: #606060;
				--color-nier-accent-warm: #ffd700;
				--color-nier-accent-cool: #87ceeb;
				
				/* Golden Ratio Spacing */
				--golden-base: 1rem;
				--golden-xs: calc(var(--golden-base) / 2.618);
				--golden-sm: calc(var(--golden-base) / 1.618);
				--golden-md: var(--golden-base);
				--golden-lg: calc(var(--golden-base) * 1.618);
				--golden-xl: calc(var(--golden-base) * 2.618);
				--golden-2xl: calc(var(--golden-base) * 4.236);
			}
			
			/* Base Styles */
			* {
				box-sizing: border-box;
			}
			
			html {
				font-family: 'JetBrains Mono', 'Roboto Mono', 'SF Mono', monospace;
				line-height: 1.6;
				-webkit-text-size-adjust: 100%;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			
			body {
				margin: 0;
				background-color: var(--color-nier-bg-primary);
				color: var(--color-nier-text-primary);
				min-height: 100vh;
				overflow-x: hidden;
			}
			
			/* Loading State */
			.app-loading {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--color-nier-bg-primary);
				z-index: 9999;
			}
			
			.loading-spinner {
				width: 3rem;
				height: 3rem;
				border: 3px solid var(--color-nier-accent-warm);
				border-top: 3px solid transparent;
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}
			
			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
			
			/* Error State */
			.app-error {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--color-nier-bg-primary);
				padding: var(--golden-lg);
				z-index: 9999;
			}
			
			.error-content {
				max-width: 32rem;
				text-align: center;
				background: var(--color-nier-bg-secondary);
				border: 1px solid #dc2626;
				border-radius: 0.5rem;
				padding: var(--golden-xl);
			}
			
			/* Accessibility Improvements */
			@media (prefers-reduced-motion: reduce) {
				* {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
				}
			}
			
			/* High Contrast Mode */
			@media (prefers-contrast: high) {
				:root {
					--color-nier-bg-primary: #000000;
					--color-nier-text-primary: #ffffff;
					--color-nier-accent-warm: #ffff00;
					--color-nier-accent-cool: #00ffff;
				}
			}
		</style>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Loading Fallback -->
		<div class="app-loading" id="app-loading">
			<div class="loading-spinner"></div>
		</div>
		
		<!-- App Container -->
		<div style="display: contents" id="app-container">%sveltekit.body%</div>
		
		<!-- Error Boundary Script -->
		<script>
			// Global error handler for initialization
			window.addEventListener('error', function(event) {
				console.error('Global Error:', event.error);
				showErrorState(event.error?.message || 'An unexpected error occurred');
			});
			
			window.addEventListener('unhandledrejection', function(event) {
				console.error('Unhandled Promise Rejection:', event.reason);
				showErrorState('A system error occurred. Please refresh the page.');
			});
			
			function showErrorState(message) {
				const loading = document.getElementById('app-loading');
				if (loading) {
					loading.innerHTML = `
						<div class="app-error">
							<div class="error-content">
								<h1 style="color: var(--color-nier-accent-warm); margin-bottom: var(--golden-md);">
									System Error
								</h1>
								<p style="color: var(--color-nier-text-secondary); margin-bottom: var(--golden-lg);">
									${message}
								</p>
								<button 
									onclick="location.reload()" 
									style="
										background: linear-gradient(90deg, var(--color-nier-accent-warm), var(--color-nier-accent-cool));
										color: var(--color-nier-bg-primary);
										border: none;
										padding: var(--golden-sm) var(--golden-lg);
										border-radius: 0.25rem;
										font-family: inherit;
										font-weight: bold;
										text-transform: uppercase;
										cursor: pointer;
										transition: opacity 0.2s;
									"
									onmouseover="this.style.opacity='0.8'"
									onmouseout="this.style.opacity='1'"
								>
									Reload Page
								</button>
							</div>
						</div>
					`;
				}
			}
			
			// Hide loading state when app is ready
			document.addEventListener('DOMContentLoaded', function() {
				setTimeout(function() {
					const loading = document.getElementById('app-loading');
					if (loading) {
						loading.style.opacity = '0';
						loading.style.transition = 'opacity 0.3s ease';
						setTimeout(function() {
							loading.remove();
						}, 300);
					}
				}, 100);
			});
			
			// Performance monitoring
			if (typeof performance !== 'undefined') {
				window.addEventListener('load', function() {
					const perfData = performance.getEntriesByType('navigation')[0];
					console.log('YoRHa Performance Metrics:', {
						loadTime: perfData.loadEventEnd - perfData.fetchStart,
						domContentLoaded: perfData.domContentLoadedEventEnd - perfData.fetchStart,
						firstPaint: performance.getEntriesByName('first-paint')[0]?.startTime || 0,
						firstContentfulPaint: performance.getEntriesByName('first-contentful-paint')[0]?.startTime || 0
					});
				});
			}
		</script>
		
		<!-- Service Worker Registration -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function() {
					navigator.serviceWorker.register('/service-worker.js')
						.then(function(registration) {
							console.log('SW registered: ', registration);
						})
						.catch(function(registrationError) {
							console.log('SW registration failed: ', registrationError);
						});
				});
			}
		</script>
	</body>
</html>
